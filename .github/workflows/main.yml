name: Build Android APK and AAB

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses < /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Cordova
        run: npm install -g cordova@13.0.0

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: npx cordova platform add android@15.1.0

      - name: Build debug APK
        run: npx cordova build android --debug

      - name: Build unsigned release AAB
        run: npx cordova build android --release -- --packageType=bundle

      - name: Collect build files
        shell: bash
        run: |
          mkdir -p artifacts
          find platforms/android/app/build/outputs/apk -type f -name "*.apk" -exec cp {} artifacts/ \; || true
          find platforms/android/app/build/outputs/bundle -type f -name "*.aab" -exec cp {} artifacts/ \; || true
          ls -lah artifacts

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Trapbound-Android-Builds
          path: artifacts/*
          if-no-files-found: error
